name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the baseline the jar is compiled for (`maven.compiler.release` 25); 26 checks that the
        # sources still compile on the next JDK. Both rows produce class-file major 69.
        java: ['25', '26']

    steps:
      - name: Checkout exeris-caps-rate-limiting
        uses: actions/checkout@v7
        with:
          path: exeris-caps-rate-limiting

      # service-boundary-core provides the RequestFilterChain the filter binds to. It has no release
      # yet, so a commit SHA is the immutable ref: a change on its main moves this build only when the
      # SHA is bumped here.
      - name: Checkout exeris-caps-service-boundary-core (d2ef07b)
        uses: actions/checkout@v7
        with:
          repository: exeris-systems/exeris-caps-service-boundary-core
          ref: d2ef07b59ba2340c5a2dfd7112b9c46890d7085b
          path: exeris-caps-service-boundary-core

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Built with the kernel, SDK and tooling versions its own POM declares, which resolve from Maven Central.
      # Its committed manifest is not regenerated here; its own CI owns that check.
      - name: Install exeris-caps-service-boundary-core to the local repository
        working-directory: exeris-caps-service-boundary-core
        run: mvn -B -ntp -DskipTests -Dexeris.codegen.skip=true install

      # Two passes, and the first is not redundant: exeris:generate runs at generate-sources, but the
      # processor writes the capability metadata it reads only during compile.
      - name: Seed capability metadata (first pass, codegen skipped)
        working-directory: exeris-caps-rate-limiting
        run: mvn -B -ntp compile -Dexeris.codegen.skip=true

      - name: mvn verify (second pass — generates, validates, scans the Wall)
        working-directory: exeris-caps-rate-limiting
        run: mvn -B -ntp verify

      - name: Assert the cap manifest was emitted and stamped
        working-directory: exeris-caps-rate-limiting
        run: |
          MANIFEST=src/main/generated/java/cap-manifest.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::no cap-manifest.json was emitted"
            exit 1
          fi
          python3 - "$MANIFEST" <<'PY'
          import json, re, sys
          m = json.load(open(sys.argv[1]))
          stamp = m.get("stamp") or {}
          assert m.get("schemaVersion") == 2, f"unexpected schemaVersion: {m.get('schemaVersion')}"
          assert stamp.get("validated") is True, "stamp is not validated"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", stamp.get("contentBinding") or ""), \
              f"bad contentBinding: {stamp.get('contentBinding')!r}"
          names = [mod.get("qualifiedName") for mod in m.get("modules") or []]
          assert "eu.exeris.caps.ratelimit.RateLimitModule" in names, \
              f"module missing from manifest: {names}"
          print("manifest OK: validated stamp, sha256 binding, module present")
          PY

      # exeris:generate writes into src/, and that tree is committed. A build whose output differs
      # from the committed copy means the declaration and the manifest a SKU consumes disagree.
      # --untracked-files=all also catches a file the build added.
      - name: Assert the committed generated tree matches this build
        working-directory: exeris-caps-rate-limiting
        run: |
          DRIFT=$(git status --porcelain --untracked-files=all -- src/main/generated/)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            git diff -- src/main/generated/ || true
            echo "::error::src/main/generated/ does not match what this build produced; run the two-pass build and commit the result"
            exit 1
          fi
